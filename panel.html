<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mantenimiento_Miraflores — Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <h1>🌿 Mantenimiento_Miraflores</h1>
      <span>· panel de tareas</span>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <a class="btn ghost small" href="bitacora.html">📔 Bitácora</a>
      <a class="btn ghost small" href="index.html">+ Cargar tarea</a>
      <button class="ghost small" id="btnRefrescar">↻ Actualizar</button>
    </div>
  </div>

  <div class="wrap">
    <div class="periodicas-header">
      <h2>🔁 Tareas periódicas</h2>
      <button class="ghost small" id="btnNuevaProgramada">+ Nueva</button>
    </div>
    <div class="periodicas-scroll" id="listaProgramadas"></div>

    <div class="filtros" style="margin-bottom: 8px;">
      <button class="btn small filtro-urg activo" data-urg="Todas">Todas</button>
      <button class="btn small filtro-urg" data-urg="Rojo">🔴 Urgente</button>
      <button class="btn small filtro-urg" data-urg="Amarillo">🟡 Puede esperar</button>
      <button class="btn small filtro-urg" data-urg="Verde">🟢 Sin apuro</button>
    </div>

    <div class="board">
      <section>
        <div class="col-header">
          <h2>Pendiente</h2>
          <span class="count" id="count-Pendiente">0</span>
        </div>
        <div id="col-Pendiente"></div>
      </section>
      <section>
        <div class="col-header">
          <h2>En proceso</h2>
          <span class="count" id="count-En proceso">0</span>
        </div>
        <div id="col-En proceso"></div>
      </section>
      <section>
        <div class="col-header">
          <h2>Resuelto <span style="font-weight:400; font-size:11px;">(historial)</span></h2>
          <span class="count" id="count-Resuelto">0</span>
        </div>
        <div id="col-Resuelto"></div>
      </section>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" style="display:none;"></div>

  <script src="config.js"></script>
  <script>
    let TAREAS = [];
    let PROGRAMADAS = [];
    let FILTRO_URG = 'Todas';

    // Llama a la API de Apps Script para escrituras (POST). Content-Type
    // "text/plain" a propósito, para que el navegador no dispare un
    // preflight de CORS antes del pedido.
    function llamarAPI(action, data) {
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, data })
      }).then(r => r.json());
    }

    function cargarTareas() {
      fetch(API_URL + '?action=tareas')
        .then(r => r.json())
        .then(onTareas)
        .catch(onError);
    }

    function onTareas(tareas) {
      TAREAS = tareas;
      render();
    }

    function onError(err) {
      mostrarToast('Error cargando datos: ' + (err.message || err));
    }

    document.querySelectorAll('.filtro-urg').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filtro-urg').forEach(b => b.classList.remove('activo'));
        btn.classList.add('activo');
        FILTRO_URG = btn.dataset.urg;
        render();
      });
    });
    // resalta el filtro activo reutilizando la clase primary
    const estiloFiltroActivo = document.createElement('style');
    estiloFiltroActivo.textContent = '.filtro-urg.activo{ background:var(--charcoal); color:var(--paper); }';
    document.head.appendChild(estiloFiltroActivo);

    document.getElementById('btnRefrescar').addEventListener('click', cargarTareas);

    function render() {
      const columnas = { 'Pendiente': [], 'En proceso': [], 'Resuelto': [] };
      TAREAS
        .filter(t => FILTRO_URG === 'Todas' || t.urgencia === FILTRO_URG)
        .forEach(t => { if (columnas[t.estado]) columnas[t.estado].push(t); });

      Object.keys(columnas).forEach(estado => {
        const cont = document.getElementById('col-' + estado);
        document.getElementById('count-' + estado).textContent = columnas[estado].length;
        cont.innerHTML = '';
        if (columnas[estado].length === 0) {
          cont.innerHTML = '<div class="empty">Nada por acá.</div>';
          return;
        }
        columnas[estado].forEach(t => cont.appendChild(fichaTarea(t)));
      });
    }

    function urgenciaClase(u) {
      return u === 'Rojo' ? 'rojo' : (u === 'Amarillo' ? 'amarillo' : 'verde');
    }

    function tiempoTranscurrido(fechaISO) {
      const ms = Date.now() - new Date(fechaISO).getTime();
      const horas = Math.floor(ms / 3600000);
      if (horas < 1) return Math.floor(ms / 60000) + 'm';
      if (horas < 24) return horas + 'h';
      return Math.floor(horas / 24) + 'd ' + (horas % 24) + 'h';
    }

    function fichaTarea(t) {
      const div = document.createElement('div');
      div.className = 'ticket';
      const clase = urgenciaClase(t.urgencia);
      const tiempo = t.estado === 'Resuelto'
        ? ('Resuelta en ' + t.tiempoResolucion)
        : ('Abierta hace ' + tiempoTranscurrido(t.fechaCreacion));

      div.innerHTML =
        '<div class="clip ' + clase + '">' + t.urgencia + '</div>' +
        '<span class="punch left"></span><span class="punch right"></span>' +
        '<div class="id mono">' + t.id + '</div>' +
        '<h3>' + escapeHtml(t.titulo) + '</h3>' +
        '<div class="meta">' +
          '<span><b>' + escapeHtml(t.ubicacion) + '</b></span>' +
          '<span>' + tiempo + '</span>' +
        '</div>' +
        '<div class="desc">' + escapeHtml(t.descripcion) + '</div>' +
        (t.fotoAntes ? '<div class="foto-preview"><img src="' + t.fotoAntes + '"></div>' : '');

      div.addEventListener('click', () => abrirModal(t));
      return div;
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    const UBICACIONES = ['Cocina', 'Salón', 'Baño', 'Barra', 'Depósito', 'Exterior', 'Otro'];
    const URGENCIAS = [['Amarillo', '🟡 Puede esperar'], ['Rojo', '🔴 Urgente'], ['Verde', '🟢 Sin apuro']];

    function opcionesUbicacion(actual) {
      return UBICACIONES.map(u => '<option' + (u === actual ? ' selected' : '') + '>' + u + '</option>').join('');
    }

    function opcionesUrgencia(actual) {
      return URGENCIAS.map(([valor, etiqueta]) =>
        '<option value="' + valor + '"' + (valor === actual ? ' selected' : '') + '>' + etiqueta + '</option>'
      ).join('');
    }

    /* ---------- TAREAS PERIÓDICAS ---------- */
    function cargarProgramadas() {
      fetch(API_URL + '?action=programadas')
        .then(r => r.json())
        .then(onProgramadas)
        .catch(onError);
    }

    function onProgramadas(lista) {
      PROGRAMADAS = lista;
      renderProgramadas();
    }

    function claseProgramada(dias) {
      if (dias <= 0) return 'vencida';
      if (dias <= 7) return 'proxima';
      return 'ok';
    }

    function textoProgramada(dias) {
      if (dias < 0) return 'Vencida hace ' + Math.abs(dias) + 'd';
      if (dias === 0) return 'Vence hoy';
      return 'Faltan ' + dias + 'd';
    }

    function renderProgramadas() {
      const cont = document.getElementById('listaProgramadas');
      cont.innerHTML = '';
      if (PROGRAMADAS.length === 0) {
        cont.innerHTML = '<div class="prog-empty">Todavía no cargaste tareas periódicas. Tocá "+ Nueva" para agregar, por ejemplo, "Limpiar canaletas" cada 90 días.</div>';
        return;
      }
      PROGRAMADAS.forEach(p => cont.appendChild(fichaProgramada(p)));
    }

    function fichaProgramada(p) {
      const div = document.createElement('div');
      const clase = claseProgramada(p.diasRestantes);
      div.className = 'prog-card ' + clase;
      div.innerHTML =
        '<h4>' + escapeHtml(p.titulo) + '</h4>' +
        '<div class="prog-ubi">' + escapeHtml(p.ubicacion) + ' · cada ' + p.frecuenciaDias + ' días</div>' +
        '<span class="prog-tiempo">' + textoProgramada(p.diasRestantes) + '</span>' +
        '<div class="prog-acciones">' +
          '<button class="small btn-hecha">✓ Hecha</button>' +
          '<button class="ghost small btn-editar-prog">✏️</button>' +
        '</div>';
      div.querySelector('.btn-hecha').addEventListener('click', () => completarProgramada(p.id));
      div.querySelector('.btn-editar-prog').addEventListener('click', () => abrirModalProgramada(p));
      return div;
    }

    function completarProgramada(id) {
      llamarAPI('completarProgramada', { id })
        .then(() => {
          mostrarToast('Marcada como hecha ✓');
          cargarProgramadas();
        })
        .catch(onError);
    }

    document.getElementById('btnNuevaProgramada').addEventListener('click', () => abrirModalProgramada());

    // Sin argumento: modal de alta. Con "p": modal de edición de esa tarea.
    function abrirModalProgramada(p) {
      const esEdicion = !!p;
      const root = document.getElementById('modalRoot');
      root.innerHTML =
        '<div class="modal-bg" id="modalBg"><div class="modal">' +
          '<h2 style="font-size:17px;">' + (esEdicion ? 'Editar tarea periódica' : 'Nueva tarea periódica') + '</h2>' +
          '<label>Título</label>' +
          '<input type="text" id="progTitulo" placeholder="Ej: Limpiar canaletas">' +
          '<label>Ubicación</label>' +
          '<select id="progUbicacion">' + opcionesUbicacion(esEdicion ? p.ubicacion : null) + '</select>' +
          '<label>Cada cuánto (en días)</label>' +
          '<input type="number" id="progFrecuencia" min="1">' +
          '<div class="hint">Ej: 7 = semanal, 30 = mensual, 90 = trimestral, 180 = semestral, 365 = anual.</div>' +
          '<label>Urgencia cuando venza</label>' +
          '<select id="progUrgencia">' + opcionesUrgencia(esEdicion ? p.urgencia : 'Amarillo') + '</select>' +
          '<button class="primary" id="btnGuardarProgramada" style="margin-top:14px; width:100%;">' +
            (esEdicion ? 'Guardar cambios' : 'Guardar') +
          '</button>' +
          (esEdicion
            ? '<button class="ghost small" id="btnEliminarProgramada" style="margin-top:10px; width:100%; color:var(--rojo); border-color:var(--rojo);">🗑 Eliminar</button>'
            : '') +
          '<div style="margin-top:10px; text-align:right;"><button class="ghost small" id="btnCerrarModal">Cerrar</button></div>' +
        '</div></div>';

      document.getElementById('progTitulo').value = esEdicion ? p.titulo : '';
      document.getElementById('progFrecuencia').value = esEdicion ? p.frecuenciaDias : 30;

      document.getElementById('modalBg').addEventListener('click', (e) => {
        if (e.target.id === 'modalBg') root.innerHTML = '';
      });
      document.getElementById('btnCerrarModal').addEventListener('click', () => root.innerHTML = '');

      document.getElementById('btnGuardarProgramada').addEventListener('click', () => {
        const titulo = document.getElementById('progTitulo').value.trim();
        if (!titulo) { mostrarToast('Ponele un título'); return; }
        const datos = {
          titulo: titulo,
          ubicacion: document.getElementById('progUbicacion').value,
          frecuenciaDias: document.getElementById('progFrecuencia').value,
          urgencia: document.getElementById('progUrgencia').value
        };
        if (esEdicion) datos.id = p.id;
        llamarAPI(esEdicion ? 'editarProgramada' : 'crearProgramada', datos)
          .then(() => {
            root.innerHTML = '';
            mostrarToast(esEdicion ? 'Cambios guardados ✓' : 'Tarea periódica creada ✓');
            cargarProgramadas();
          })
          .catch(onError);
      });

      if (esEdicion) {
        document.getElementById('btnEliminarProgramada').addEventListener('click', () => {
          if (!confirm('¿Eliminar "' + p.titulo + '"? No se puede deshacer.')) return;
          llamarAPI('eliminarProgramada', { id: p.id })
            .then(() => {
              root.innerHTML = '';
              mostrarToast('Eliminada');
              cargarProgramadas();
            })
            .catch(onError);
        });
      }
    }

    /* ---------- MODAL DE DETALLE ---------- */
    function abrirModal(t) {
      const root = document.getElementById('modalRoot');
      const clase = urgenciaClase(t.urgencia);
      root.innerHTML =
        '<div class="modal-bg" id="modalBg"><div class="modal">' +
          '<span class="tag ' + clase + '"><span class="dot"></span>' + t.urgencia + '</span>' +
          '<h2 style="font-size:17px; margin-top:10px;">' + escapeHtml(t.titulo) + '</h2>' +
          '<p class="mono" style="font-size:11px; color:var(--ink-soft);">' + t.id + '</p>' +
          '<p style="font-size:13px;"><b>Ubicación:</b> ' + escapeHtml(t.ubicacion) + '<br>' +
            '<b>Reportado por:</b> ' + escapeHtml(t.reportadoPor || '—') + '<br>' +
            '<b>Estado actual:</b> ' + t.estado + '</p>' +
          '<p style="font-size:13.5px;">' + escapeHtml(t.descripcion) + '</p>' +
          '<div class="fotos-row">' +
            (t.fotoAntes ? '<figure><img src="' + t.fotoAntes + '"><figcaption>Antes</figcaption></figure>' : '') +
            (t.fotoDespues ? '<figure><img src="' + t.fotoDespues + '"><figcaption>Después</figcaption></figure>' : '') +
          '</div>' +
          (t.notasResolucion ? '<p style="font-size:13px; margin-top:10px;"><b>Notas:</b> ' + escapeHtml(t.notasResolucion) + '</p>' : '') +
          '<div style="margin-top:12px; display:flex; gap:8px;">' +
            '<button class="ghost small" id="btnEditarTarea">✏️ Editar</button>' +
            '<button class="ghost small" id="btnEliminarTarea" style="color:var(--rojo); border-color:var(--rojo);">🗑 Eliminar</button>' +
          '</div>' +
          '<div id="formEditarTarea" style="display:none; margin-top:12px;"></div>' +
          '<hr style="border:none; border-top:1px solid var(--steel-dim); margin:16px 0;">' +
          accionesModal(t) +
          '<div style="margin-top:14px; text-align:right;">' +
            '<button class="ghost small" id="btnCerrarModal">Cerrar</button>' +
          '</div>' +
        '</div></div>';

      document.getElementById('modalBg').addEventListener('click', (e) => {
        if (e.target.id === 'modalBg') root.innerHTML = '';
      });
      document.getElementById('btnCerrarModal').addEventListener('click', () => root.innerHTML = '');

      document.getElementById('btnEditarTarea').addEventListener('click', () => {
        const cont = document.getElementById('formEditarTarea');
        if (cont.style.display !== 'none') { cont.style.display = 'none'; cont.innerHTML = ''; return; }
        cont.style.display = 'block';
        cont.innerHTML =
          '<label>Título</label><input type="text" id="editTitulo">' +
          '<label>Ubicación</label><select id="editUbicacion">' + opcionesUbicacion(t.ubicacion) + '</select>' +
          '<label>Urgencia</label><select id="editUrgencia">' + opcionesUrgencia(t.urgencia) + '</select>' +
          '<label>Descripción</label><textarea id="editDescripcion"></textarea>' +
          '<button class="primary small" id="btnGuardarEdicion" style="margin-top:10px; width:100%;">Guardar cambios</button>';
        document.getElementById('editTitulo').value = t.titulo;
        document.getElementById('editDescripcion').value = t.descripcion;

        document.getElementById('btnGuardarEdicion').addEventListener('click', () => {
          const datos = {
            id: t.id,
            titulo: document.getElementById('editTitulo').value,
            ubicacion: document.getElementById('editUbicacion').value,
            urgencia: document.getElementById('editUrgencia').value,
            descripcion: document.getElementById('editDescripcion').value
          };
          llamarAPI('editarTarea', datos)
            .then(() => {
              root.innerHTML = '';
              mostrarToast('Actualizado ✓');
              cargarTareas();
            })
            .catch(onError);
        });
      });

      document.getElementById('btnEliminarTarea').addEventListener('click', () => {
        if (!confirm('¿Eliminar esta tarea? No se puede deshacer.')) return;
        llamarAPI('eliminarTarea', { id: t.id })
          .then(() => {
            root.innerHTML = '';
            mostrarToast('Eliminada');
            cargarTareas();
          })
          .catch(onError);
      });

      if (t.estado === 'Pendiente') {
        document.getElementById('btnEnProceso').addEventListener('click', () => {
          cambiarEstado(t.id, 'En proceso', '', null);
        });
      }
      if (t.estado !== 'Resuelto') {
        document.getElementById('btnResolver').addEventListener('click', () => {
          const notas = document.getElementById('notasResolucion').value;
          const fotoFile = document.getElementById('fotoDespues').files[0];
          const btn = document.getElementById('btnResolver');
          btn.disabled = true; btn.textContent = 'Guardando...';
          if (fotoFile) {
            comprimirImagen(fotoFile).then(b64 => cambiarEstado(t.id, 'Resuelto', notas, b64));
          } else {
            cambiarEstado(t.id, 'Resuelto', notas, null);
          }
        });
      }
    }

    function accionesModal(t) {
      if (t.estado === 'Resuelto') return '';
      let html = '<div>';
      if (t.estado === 'Pendiente') {
        html += '<button id="btnEnProceso" style="margin-bottom:12px;">Marcar "en proceso"</button>';
      }
      html +=
        '<label>Notas de resolución</label>' +
        '<textarea id="notasResolucion" placeholder="Qué se hizo, repuestos usados, etc."></textarea>' +
        '<label>Foto de después (opcional)</label>' +
        '<input type="file" id="fotoDespues" accept="image/*" capture="environment">' +
        '<button class="primary" id="btnResolver" style="margin-top:14px; width:100%;">Marcar como resuelto</button>' +
      '</div>';
      return html;
    }

    function cambiarEstado(id, nuevoEstado, notas, fotoDespuesB64) {
      llamarAPI('actualizarEstado', { id, nuevoEstado, notas, fotoDespuesBase64: fotoDespuesB64 })
        .then(() => {
          document.getElementById('modalRoot').innerHTML = '';
          mostrarToast('Actualizado ✓');
          cargarTareas();
        })
        .catch(onError);
    }

    function comprimirImagen(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxAncho = 1200;
            const escala = Math.min(1, maxAncho / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = img.width * escala;
            canvas.height = img.height * escala;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.75));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function mostrarToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    cargarTareas();
    cargarProgramadas();
    setInterval(cargarTareas, 60000); // se actualiza solo cada 1 minuto
    setInterval(cargarProgramadas, 60000);
  </script>
</body>
</html>
